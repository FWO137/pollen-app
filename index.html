<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090B09" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <title>Pollenflug</title>
  <meta name="description" content="Pollenflug-Vorhersage für Bayern, Baden-Württemberg und Österreich – Standort, Belastung und die nächsten 3 Tage auf einen Blick.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pollenflug">
  <meta property="og:description" content="Pollenflug-Vorhersage für Bayern, Baden-Württemberg und Österreich – Standort, Belastung und die nächsten 3 Tage auf einen Blick.">
  <meta property="og:image" content="https://pollen-check.netlify.app/icons/og-image.png">
  <meta property="og:url" content="https://pollen-check.netlify.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pollenflug">
  <meta name="twitter:description" content="Pollenflug-Vorhersage für Bayern, Baden-Württemberg und Österreich.">
  <meta name="twitter:image" content="https://pollen-check.netlify.app/icons/og-image.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #F3F4F1;
      --bdr:  rgba(0,0,0,0.08);
      --t1:   #111410;
      --t2:   rgba(17,20,16,0.50);
      --t3:   rgba(17,20,16,0.26);

      --c-none: #9CA3AF;
      --c-low:  #15803D;
      --c-med:  #B45309;
      --c-high: #C2410C;
      --c-vhi:  #B91C1C;

      --accent: #9A6F00;
      --glow-a: 0.22;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:   #090B09;
        --bdr:  rgba(255,255,255,0.08);
        --t1:   #E6E8E3;
        --t2:   rgba(230,232,227,0.46);
        --t3:   rgba(230,232,227,0.24);

        --c-none: #6B7280;
        --c-low:  #4ADE80;
        --c-med:  #FBBF24;
        --c-high: #FB923C;
        --c-vhi:  #F87171;

        --accent: #CCA020;
        --glow-a: 0.36;
      }
    }
    :root[data-theme="dark"] {
      --bg:   #090B09; --bdr: rgba(255,255,255,0.08);
      --t1:   #E6E8E3; --t2: rgba(230,232,227,0.46); --t3: rgba(230,232,227,0.24);
      --c-none: #6B7280; --c-low: #4ADE80; --c-med: #FBBF24;
      --c-high: #FB923C; --c-vhi: #F87171;
      --accent: #CCA020; --glow-a: 0.36;
    }

    html { background: var(--bg); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* No focus styling existed anywhere before this — unusable via an
       external keyboard or Switch Control, which don't use mouse/touch
       and rely entirely on a visible focus indicator. :focus-visible
       (not :focus) keeps mouse/touch clicks free of an outline. */
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    /* ── Atmospheric glow ── */
    .glow-ring {
      position: fixed;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 800px; height: 440px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      transition: background 1s ease;
    }
    .glow-ring.l-none     { background: radial-gradient(ellipse at 50% 30%, rgba(156,163,175,var(--glow-a)) 0%, transparent 65%); }
    .glow-ring.l-low      { background: radial-gradient(ellipse at 50% 30%, rgba(74,222,128,var(--glow-a))  0%, transparent 65%); }
    .glow-ring.l-medium   { background: radial-gradient(ellipse at 50% 30%, rgba(251,191,36,var(--glow-a))  0%, transparent 65%); }
    .glow-ring.l-high     { background: radial-gradient(ellipse at 50% 30%, rgba(251,146,60,var(--glow-a))  0%, transparent 65%); }
    .glow-ring.l-very-high{ background: radial-gradient(ellipse at 50% 30%, rgba(248,113,113,var(--glow-a)) 0%, transparent 65%); }

    /* ── App shell ── */
    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top, 0px) + 28px)
        calc(env(safe-area-inset-right, 0px) + 22px)
        calc(env(safe-area-inset-bottom, 0px) + 64px)
        calc(env(safe-area-inset-left, 0px) + 22px);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 52px;
    }

    .location-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--t2);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
      -webkit-user-select: none;
      user-select: none;
    }
    .location-btn.loading { opacity: 0.4; pointer-events: none; }

    .loc-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--t3);
      flex-shrink: 0;
      transition: background 0.4s ease;
    }
    /* color the dot when data is loaded — JS adds a level class to .header */
    .header.l-none     .loc-pulse { background: var(--c-none); }
    .header.l-low      .loc-pulse { background: var(--c-low);  }
    .header.l-medium   .loc-pulse { background: var(--c-med);  }
    .header.l-high     .loc-pulse { background: var(--c-high); }
    .header.l-very-high.loc-pulse { background: var(--c-vhi);  }

    /* ── Day tabs ── */
    .day-tabs {
      display: flex;
      gap: 20px;
    }

    .day-tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--t3);
      background: none;
      border: none;
      padding: 4px 0;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
      transition: color 0.15s;
    }
    .day-tab.active { color: var(--t1); font-weight: 700; }

    .day-tab::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -4px;
      height: 2px;
      border-radius: 1px;
      background: var(--accent);
      opacity: 0;
      transform: scaleX(0.5);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .day-tab.active::after { opacity: 1; transform: scaleX(1); }

    .tab-date {
      font-size: 10px;
      font-weight: 400;
      color: var(--t3);
    }
    .day-tab.active .tab-date { color: var(--t2); }

    /* ── Hero (built by JS into #summary) ── */
    .hero { margin-bottom: 52px; }

    .hero-eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--t3);
      margin-bottom: 10px;
    }

    .hero-level {
      font-size: clamp(52px, 16vw, 76px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.88;
      margin-bottom: 18px;
      transition: color 0.5s ease;
    }
    .hero-level.l-none      { color: var(--c-none); }
    .hero-level.l-low       { color: var(--c-low);  }
    .hero-level.l-medium    { color: var(--c-med);  }
    .hero-level.l-high      { color: var(--c-high); }
    .hero-level.l-very-high { color: var(--c-vhi);  }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--t2);
    }
    .hero-meta strong { font-weight: 600; color: var(--t1); }
    .hero-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--t3); flex-shrink: 0; }

    /* ── Pollen list (built by JS into #content) ── */
    .list-head {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--t3);
      margin-bottom: 2px;
    }

    .pollen-list { display: flex; flex-direction: column; }

    .p-row {
      display: grid;
      grid-template-columns: 98px 1fr 76px;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--bdr);
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .p-row:nth-child(1)  { animation-delay:  0ms; }
    .p-row:nth-child(2)  { animation-delay: 30ms; }
    .p-row:nth-child(3)  { animation-delay: 60ms; }
    .p-row:nth-child(4)  { animation-delay: 90ms; }
    .p-row:nth-child(5)  { animation-delay:120ms; }

    .p-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--t1);
      white-space: nowrap;
    }
    .p-icon {
      display: inline-block;
      font-size: 13px;
      margin-right: 5px;
      filter: saturate(0.85);
    }

    .p-track {
      height: 3px;
      border-radius: 1.5px;
      background: var(--bdr);
      position: relative;
      overflow: hidden;
    }
    .p-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--pct, 0%);
      border-radius: 1.5px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .l-none     .p-fill { background: var(--c-none); opacity: 0.35; }
    .l-low      .p-fill { background: var(--c-low);  }
    .l-medium   .p-fill { background: var(--c-med);  }
    .l-high     .p-fill { background: var(--c-high); }
    .l-very-high.p-fill { background: var(--c-vhi);  }
    .p-row.l-very-high .p-fill { background: var(--c-vhi); }

    .p-val {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
      transition: color 0.5s ease;
    }
    .p-val .u { font-size: 10px; font-weight: 400; color: var(--t3); margin-left: 2px; }

    .p-row.l-none      .p-val { color: var(--t3); font-weight: 400; }
    .p-row.l-low       .p-val { color: var(--c-low);  }
    .p-row.l-medium    .p-val { color: var(--c-med);  }
    .p-row.l-high      .p-val { color: var(--c-high); }
    .p-row.l-very-high .p-val { color: var(--c-vhi);  }

    /* ── No-pollen group ── */
    .no-pollen {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      padding: 13px 0 0;
    }
    .np-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--t3); white-space: nowrap;
    }
    .np-list { font-size: 12px; color: var(--t2); line-height: 1.7; }

    /* ── Stand / source line ── */
    .stand-line {
      margin-top: 20px;
      font-size: 11px;
      color: var(--t3);
      line-height: 1.7;
    }

    /* ── State views ── */
    .state-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 12px;
    }
    .state-view p { font-size: 14px; color: var(--t2); text-align: center; }
    .state-view .err-detail { font-size: 11px; color: var(--t3); }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--bdr);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      margin-top: 4px;
      background: var(--t1);
      color: var(--bg);
      border: none;
      border-radius: 22px;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
    }

    /* ── Location picker ── */
    .location-picker { padding: 4px 0 8px; }

    .picker-hint {
      font-size: 14px; color: var(--t2); line-height: 1.55; margin-bottom: 24px;
    }
    .picker-hint strong { color: var(--t1); display: block; font-size: 16px; margin-bottom: 4px; }

    .picker-debug {
      font-size: 11px; font-family: ui-monospace, monospace; color: var(--t3);
      line-height: 1.5; margin: -14px 0 20px; word-break: break-word;
    }

    .picker-section { margin-bottom: 20px; }
    .picker-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--t3); margin-bottom: 10px;
    }
    .picker-pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .picker-pill {
      background: none;
      border: 1px solid var(--bdr);
      border-radius: 20px;
      padding: 7px 15px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--t1); cursor: pointer;
      touch-action: manipulation; min-height: 36px;
      -webkit-user-select: none; user-select: none;
    }
    .picker-pill:active { opacity: 0.6; }

    .picker-retry {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none;
      font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--accent); cursor: pointer;
      touch-action: manipulation; padding: 0; min-height: 44px; margin-bottom: 20px;
    }

    /* ── Footer ── */
    /* Informational text (not purely decorative), so it uses --t2 rather
       than the very low-contrast --t3 used for hairline/label accents. */
    .footer {
      margin-top: 48px;
      font-size: 11px;
      color: var(--t2);
      line-height: 2.0;
    }
    .footer a { color: var(--t2); text-decoration: underline; text-decoration-color: var(--bdr); }

    .theme-toggle {
      font-family: inherit; font-size: 11px; color: var(--t2);
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: underline; text-decoration-color: var(--bdr);
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <!-- Announces loading/error/data-loaded state changes to screen readers,
       independent of the (visually) rich content that #content re-renders. -->
  <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Atmospheric level glow -->
  <div class="glow-ring" id="glowRing"></div>

  <div class="app">

    <header class="header" id="appHeader">
      <button class="location-btn" id="geoBtn" aria-label="Standort aktualisieren">
        <span class="loc-pulse"></span>
        <span id="locationName">Standort ermitteln …</span>
      </button>
      <nav class="day-tabs" id="dayTabs" aria-label="Tagauswahl">
        <button class="day-tab active" data-day="0">
          Heute
          <span class="tab-date" id="tabDate0"></span>
        </button>
        <button class="day-tab" data-day="1">
          Morgen
          <span class="tab-date" id="tabDate1"></span>
        </button>
        <button class="day-tab" data-day="2">
          Üb.
          <span class="tab-date" id="tabDate2"></span>
        </button>
      </nav>
    </header>

    <!-- Hero (populated by render()) -->
    <div id="summary" style="display:none;"></div>

    <!-- Pollen list (populated by render()) -->
    <div id="content"></div>

    <footer class="footer">
      <a href="https://www.dwd.de" target="_blank" rel="noopener">DWD</a> ·
      <a href="https://epin.lgl.bayern.de" target="_blank" rel="noopener">LGL Bayern ePIN</a> ·
      <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><br>
      Kein Ersatz für ärztlichen Rat<br>
      <button class="theme-toggle" id="themeToggle" type="button">Darstellung: <span id="themeToggleLabel">Automatisch</span></button>
    </footer>

  </div>

  <script src="pollen-logic.js"></script>
  <script>
  // pollen-logic.js is a plain (non-module) script load, so a failure there
  // (flaky network, ad/script blocker, CDN blip) would otherwise leave the
  // very next line's destructuring throw silently — the whole app hangs
  // forever on "Standort wird ermittelt …" with no error shown at all.
  // Guard it explicitly instead of relying on that failing loudly.
  if (!window.PollenLogic) {
    document.getElementById('srStatus') && (document.getElementById('srStatus').textContent = 'App konnte nicht geladen werden.');
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <p style="font-size:24px">⚠️</p>
        <p>App konnte nicht geladen werden.</p>
        <p class="err-detail">Ein notwendiges Skript (pollen-logic.js) ist nicht verfügbar. Bitte Internetverbindung prüfen und neu laden.</p>
        <button class="retry-btn" onclick="location.reload()">Neu laden</button>
      </div>`;
  } else {
  // Pure lookup tables & data-processing functions live in pollen-logic.js
  // (loaded above, also covered by tests/pollen-logic.test.mjs).
  const {
    LOCATIONS, POLLEN, LEVELS, SUMMARY_DE, SNAP_MAX_KM,
    highestLevel, fmtDate, fmtDataTimestamp, nearestLocation,
    extractDWDDays, processOM, processLGL, buildDays,
  } = window.PollenLogic;

  // ─── State ───────────────────────────────────────────────────────────────────
  const state = {
    locationKey:    'munich',
    selectedDay:    0,
    data:           null,
    customCoords:   null,
    dataTimestamp:  null,
    snapDistanceKm: null,
  };

  let dwdCache = null;
  let lglCache = null;

  // ─── fetch with timeout ──────────────────────────────────────────────────────
  // Plain fetch() has no timeout; a stalled request would otherwise leave the
  // loading spinner stuck forever instead of surfacing a retryable error.
  async function fetchWithTimeout(url, timeoutMs = 10000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: ctrl.signal });
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('Zeitüberschreitung beim Laden');
      throw err;
    } finally {
      clearTimeout(t);
    }
  }

  // ─── DWD API ─────────────────────────────────────────────────────────────────
  const DWD_URL = 'https://opendata.dwd.de/climate_environment/health/alerts/s31fg.json';
  function dwdFetchUrl() {
    return location.hostname.endsWith('.netlify.app') || location.hostname.endsWith('.netlify.com')
      ? '/dwd-api'
      : `https://cors.eu.org/${DWD_URL}`;
  }

  async function fetchDWD() {
    if (dwdCache) return dwdCache;
    const r = await fetchWithTimeout(dwdFetchUrl());
    if (!r.ok) throw new Error('DWD ' + r.status);
    dwdCache = await r.json();
    return dwdCache;
  }

  // ─── Open-Meteo API ───────────────────────────────────────────────────────────
  async function fetchOM(lat, lon) {
    const vars = POLLEN.filter(p => p.om).map(p => p.om).join(',');
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality`
      + `?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=auto&forecast_days=3`;
    const r = await fetchWithTimeout(url);
    if (!r.ok) throw new Error('Open-Meteo ' + r.status);
    return r.json();
  }

  // ─── LGL Bayern ePIN API ─────────────────────────────────────────────────────
  const LGL_URL = 'https://epin.lgl.bayern.de/api/measurements';
  function lglFetchUrl() {
    return location.hostname.endsWith('.netlify.app') || location.hostname.endsWith('.netlify.com')
      ? '/lgl-api'
      : `https://cors.eu.org/${LGL_URL}`;
  }

  async function fetchLGL() {
    if (lglCache) return lglCache;
    const r = await fetchWithTimeout(lglFetchUrl());
    if (!r.ok) throw new Error('LGL ' + r.status);
    lglCache = await r.json();
    return lglCache;
  }

  // ─── Cache (localStorage) ────────────────────────────────────────────────────
  // Lets the app render instantly from the last known state on revisit,
  // instead of always blocking on a fresh GPS fix + 3 API calls first.
  const CACHE_KEY = 'pollenCacheV1';

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const c = JSON.parse(raw);
      return c?.data?.length ? c : null;
    } catch {
      return null;
    }
  }

  function saveCache(locationName) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        locationKey:   state.locationKey,
        customCoords:  state.customCoords,
        data:          state.data,
        dataTimestamp: state.dataTimestamp,
        locationName,
        savedAt:       Date.now(),
      }));
    } catch {
      // localStorage unavailable (e.g. private browsing) — cache is a nice-to-have, skip it.
    }
  }

  // ─── Load ────────────────────────────────────────────────────────────────────
  // Sequencing token: if a manual refresh is triggered while a background
  // refresh (or another manual one) is still in flight, both run
  // concurrently — without this, whichever network response happens to
  // land last would win and overwrite the other's result, regardless of
  // which request was actually the most recent/intended one.
  let loadSeq = 0;

  // `silent`: true for background refreshes that already have a rendered
  // view on screen — skips the full-screen spinner/error takeover so the
  // stale-but-good view stays up instead of flashing to a loading state.
  async function loadData({ silent = false } = {}) {
    const seq = ++loadSeq;
    if (!silent) showLoading();
    const snapped = LOCATIONS[state.locationKey];
    const tooFar = state.snapDistanceKm != null && state.snapDistanceKm > SNAP_MAX_KM;
    const loc = state.customCoords
      ? {
          lat: state.customCoords.lat,
          lon: state.customCoords.lon,
          country: snapped?.country ?? 'DE',
          dwd: tooFar ? null : snapped?.dwd ?? null,
          lgl: tooFar ? null : snapped?.lgl ?? null,
        }
      : snapped;

    try {
      let dwdDays = null, omDays = null, lglToday = null, dataTimestamp = null;
      const lglStation = loc.lgl ?? null;

      if (loc.country === 'DE' && loc.dwd != null) {
        const [dwdResult, omResult, lglResult] = await Promise.allSettled([
          fetchDWD().then(raw => extractDWDDays(raw, loc.dwd)),
          fetchOM(loc.lat, loc.lon).then(processOM),
          lglStation ? fetchLGL().then(raw => processLGL(raw, lglStation)) : Promise.resolve(null),
        ]);
        const dwdVal       = dwdResult.status === 'fulfilled' ? dwdResult.value : null;
        dwdDays            = dwdVal?.days ?? null;
        const dwdLastUpdate = dwdVal?.lastUpdate ?? null;
        omDays             = omResult.status === 'fulfilled' ? omResult.value : null;
        const lglVal       = lglResult.status === 'fulfilled' ? lglResult.value : null;
        lglToday           = lglVal?.data ?? null;
        const lglDataDate  = lglVal?.dataDate ?? null;
        if (dwdDays === null && omDays === null && lglToday === null)
          throw new Error('Alle Datenquellen nicht verfügbar');
        dataTimestamp = lglDataDate ?? dwdLastUpdate ?? null;
      } else {
        const omRaw = await fetchOM(loc.lat, loc.lon);
        omDays = processOM(omRaw);
        dataTimestamp = null;
      }

      if (seq !== loadSeq) return; // superseded by a newer load — discard this result

      state.dataTimestamp = dataTimestamp;
      state.data = buildDays(dwdDays, omDays, lglToday);
      render();
      saveCache(document.getElementById('locationName').textContent);
    } catch (err) {
      if (seq !== loadSeq) return; // superseded — don't clobber a newer render with a stale error
      if (silent) {
        console.warn('Background refresh failed, keeping cached view', err);
      } else {
        showError(err.message);
      }
    }
  }

  // ─── Location picker ─────────────────────────────────────────────────────────
  function showLocationPicker(permissionDenied, debugInfo) {
    document.getElementById('locationName').textContent = 'Standort wählen';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('glowRing').className = 'glow-ring';

    const DE_KEYS = ['pfarrkirchen','munich','nuremberg','augsburg','ingolstadt','regensburg','stuttgart','freiburg','ulm','constance'];
    const AT_KEYS = ['vienna','salzburg','innsbruck','graz','linz','klagenfurt','bregenz'];
    const pills = keys => keys.map(k =>
      `<button class="picker-pill" data-key="${k}">${LOCATIONS[k].name}</button>`
    ).join('');

    const retryRow = permissionDenied ? '' : `
      <button class="picker-retry" id="retryGeoBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Standort erneut ermitteln
      </button>`;

    const hint = permissionDenied
      ? '<strong>Standortzugriff nicht erlaubt</strong>In Safari: Adressleiste → <b>AA</b> → Website-Einstellungen → Standort → <b>Erlauben</b>. Danach diese Seite neu laden.'
      : '<strong>Standort nicht ermittelbar</strong>Prüfe unter Einstellungen → Datenschutz &amp; Sicherheit → Ortungsdienste, dass die Ortungsdienste sowie der Zugriff für Safari aktiviert sind. Oder wähle einen Ort:';

    const debugRow = debugInfo
      ? `<p class="picker-debug">Diagnose: ${debugInfo}</p>`
      : '';

    document.getElementById('content').innerHTML = `
      <div class="location-picker">
        <p class="picker-hint">${hint}</p>
        ${debugRow}
        ${retryRow}
        <div class="picker-section">
          <div class="picker-section-label">Bayern &amp; Baden-Württemberg</div>
          <div class="picker-pills">${pills(DE_KEYS)}</div>
        </div>
        <div class="picker-section">
          <div class="picker-section-label">Österreich</div>
          <div class="picker-pills">${pills(AT_KEYS)}</div>
        </div>
      </div>`;

    announce(permissionDenied
      ? 'Standortzugriff nicht erlaubt. Bitte wähle einen Ort aus der Liste.'
      : 'Standort nicht ermittelbar. Bitte wähle einen Ort aus der Liste.');

    document.getElementById('content').addEventListener('click', e => {
      if (e.target.closest('#retryGeoBtn')) { requestGeo(); return; }
      const pill = e.target.closest('.picker-pill');
      if (!pill) return;
      state.locationKey  = pill.dataset.key;
      state.customCoords = null;
      document.getElementById('locationName').textContent = LOCATIONS[pill.dataset.key].name;
      loadData();
    });
  }

  // ─── Geolocation ─────────────────────────────────────────────────────────────
  // `background: true` is used for the silent refresh that follows a
  // cache-hydrated render at startup: it must not blank out the already
  // visible cached view with the spinner/picker while it re-checks GPS.
  function requestGeo({ background = false } = {}) {
    const btn    = document.getElementById('geoBtn');
    const nameEl = document.getElementById('locationName');

    if (!navigator.geolocation) {
      if (!background) {
        showLocationPicker(false, 'navigator.geolocation nicht verfügbar (kein HTTPS oder nicht unterstützt).');
      }
      return;
    }

    btn.classList.add('loading');
    if (!background) {
      nameEl.textContent = 'Standort wird ermittelt …';
      showLoading();
    }

    const onSuccess = ({ coords }) => {
      btn.classList.remove('loading');
      const { key: nearest, distanceKm } = nearestLocation(coords.latitude, coords.longitude);
      state.locationKey    = nearest;
      state.customCoords   = { lat: coords.latitude, lon: coords.longitude };
      state.snapDistanceKm = distanceKm;
      nameEl.textContent = LOCATIONS[nearest].name;
      loadData({ silent: background && !!state.data });
    };

    const ERR_NAMES = { 1: 'PERMISSION_DENIED', 2: 'POSITION_UNAVAILABLE', 3: 'TIMEOUT' };

    const onFinalError = (err) => {
      btn.classList.remove('loading');
      if (background) {
        console.warn('Background geolocation refresh failed, keeping cached view', err.code, err.message);
        return;
      }
      console.error('Geolocation error', err.code, err.message);
      const info = `Code ${err.code} (${ERR_NAMES[err.code] || 'unbekannt'})${err.message ? ' – ' + err.message : ''}`;
      showLocationPicker(err.code === 1, info);
    };

    navigator.geolocation.getCurrentPosition(
      onSuccess,
      (err) => {
        // iOS frequently times out or reports POSITION_UNAVAILABLE on the
        // first high-accuracy fix (cold GPS start, indoors, weak signal).
        // Retry once with relaxed accuracy and a longer timeout before
        // giving up. A permission denial won't change on retry, so skip
        // straight to the picker in that case.
        if (err.code === 1) { onFinalError(err); return; }
        navigator.geolocation.getCurrentPosition(
          onSuccess,
          onFinalError,
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 }
        );
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 300000 }
    );
  }

  // ─── Render ──────────────────────────────────────────────────────────────────
  function setGlow(level) {
    document.getElementById('glowRing').className = `glow-ring l-${level}`;
  }

  // Concise status text for screen readers, decoupled from the (visually)
  // rich markup #content re-renders on every state change.
  function announce(text) {
    const el = document.getElementById('srStatus');
    if (el) el.textContent = text;
  }

  function showLoading() {
    setGlow('');
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <div class="spinner"></div>
        <p>Pollendaten werden geladen …</p>
      </div>`;
    announce('Pollendaten werden geladen');
  }

  function showError(msg) {
    setGlow('');
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <p style="font-size:24px">⚠️</p>
        <p>Daten konnten nicht geladen werden.</p>
        <p class="err-detail">${msg}</p>
        <button class="retry-btn" onclick="location.reload()">Neu laden</button>
      </div>`;
    announce('Fehler beim Laden der Pollendaten: ' + msg);
  }

  function render() {
    if (!state.data?.length) return showError('Keine Daten verfügbar');
    const dayData = state.data[state.selectedDay];
    if (!dayData) return showError('Prognosedaten nicht verfügbar');

    // Update tab dates
    state.data.forEach((day, i) => {
      const el = document.getElementById(`tabDate${i}`);
      if (el && day?.date) el.textContent = fmtDate(day.date);
    });

    // Overall level & dominant pollen
    const levelsWithData = POLLEN
      .filter(p => dayData.pollens[p.key] !== null)
      .map(p => dayData.pollens[p.key]?.level ?? 'none');
    const overall = highestLevel(levelsWithData);

    let dominant = null, domIdx = -1;
    for (const p of POLLEN) {
      const entry = dayData.pollens[p.key];
      if (!entry) continue;
      const idx = LEVELS.indexOf(entry.level);
      if (idx > domIdx) { domIdx = idx; dominant = p; }
    }

    // Glow
    setGlow(overall);

    // Sources & stand
    const SOURCE_LABELS = { lgl: 'LGL Bayern ePIN', dwd: 'DWD', om: 'Open-Meteo' };
    const usedSources = new Set();
    for (const p of POLLEN) {
      const src = dayData.pollens[p.key]?.source;
      if (src) usedSources.add(src);
    }
    const sourceText = [...usedSources].map(s => SOURCE_LABELS[s] || s).join(' · ');
    const standText  = fmtDataTimestamp(state.dataTimestamp);

    // ── Hero ──
    const words = SUMMARY_DE[overall].split(' ');
    const heroHtml = words.slice(0, -1).join(' ') + '<br>' + words[words.length - 1];
    const dominantLabel = dominant && domIdx > 0
      ? `Hauptbelastung: <strong>${dominant.name}</strong>`
      : 'Keine aktiven Pollen';

    const summaryEl = document.getElementById('summary');
    summaryEl.style.display = 'block';
    summaryEl.innerHTML = `
      <div class="hero">
        <div class="hero-eyebrow">Pollenbelastung</div>
        <div class="hero-level l-${overall}">${heroHtml}</div>
        <div class="hero-meta">
          <span>${fmtDate(dayData.date)}</span>
          <span class="hero-sep"></span>
          <span>${dominantLabel}</span>
        </div>
      </div>`;

    // ── Pollen list ──
    const sortedPollen = [...POLLEN].sort((a, b) => {
      const aE = dayData.pollens[a.key];
      const bE = dayData.pollens[b.key];
      if (!aE && !bE) return 0; if (!aE) return 1; if (!bE) return -1;
      return LEVELS.indexOf(bE.level) - LEVELS.indexOf(aE.level);
    });

    const active   = sortedPollen.filter(p => dayData.pollens[p.key]?.level !== 'none' && dayData.pollens[p.key] !== null);
    const noFlight = sortedPollen.filter(p => !dayData.pollens[p.key] || dayData.pollens[p.key].level === 'none');

    const wrap = document.createElement('div');

    const lh = document.createElement('div');
    lh.className = 'list-head';
    lh.textContent = 'Pollenarten';
    wrap.appendChild(lh);

    const list = document.createElement('div');
    list.className = 'pollen-list';

    for (const p of active) {
      const entry = dayData.pollens[p.key];
      const row = document.createElement('div');
      row.className = `p-row l-${entry.level}`;
      row.style.setProperty('--pct', `${entry.pct ?? 0}%`);
      row.innerHTML = `
        <div class="p-name"><span class="p-icon" aria-hidden="true">${p.icon}</span>${p.name}</div>
        <div class="p-track"><div class="p-fill"></div></div>
        <div class="p-val">${entry.display}<span class="u">${entry.unit}</span></div>`;
      list.appendChild(row);
    }

    if (noFlight.length > 0) {
      const nf = document.createElement('div');
      nf.className = 'no-pollen';
      nf.innerHTML = `
        <span class="np-label">Kein Flug</span>
        <span class="np-list">${noFlight.map(p => p.name).join(' · ')}</span>`;
      list.appendChild(nf);
    }

    wrap.appendChild(list);

    const sl = document.createElement('div');
    sl.className = 'stand-line';
    sl.textContent = sourceText + (standText ? ' · Stand: ' + standText : '');
    wrap.appendChild(sl);

    document.getElementById('content').replaceChildren(wrap);

    const dominantText = dominant && domIdx > 0 ? `, Hauptbelastung ${dominant.name}` : '';
    announce(`${SUMMARY_DE[overall]} für ${LOCATIONS[state.locationKey]?.name ?? 'deinen Standort'}${dominantText}`);
  }

  // ─── Tabs & date labels ───────────────────────────────────────────────────────
  function setupDateLabels() {
    const today = new Date();
    for (let i = 0; i < 3; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const el = document.getElementById(`tabDate${i}`);
      if (el) el.textContent = d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
    }
  }

  function syncTabs() {
    document.querySelectorAll('.day-tab').forEach(t => {
      t.classList.toggle('active', parseInt(t.dataset.day) === state.selectedDay);
    });
  }

  // ─── Events ──────────────────────────────────────────────────────────────────
  document.getElementById('dayTabs').addEventListener('click', e => {
    const tab = e.target.closest('.day-tab');
    if (!tab) return;
    state.selectedDay = parseInt(tab.dataset.day, 10);
    syncTabs();
    render();
  });

  document.getElementById('geoBtn').addEventListener('click', () => {
    dwdCache = null;
    lglCache = null;
    state.data = null;
    state.dataTimestamp = null;
    requestGeo();
  });

  // ─── Theme toggle ────────────────────────────────────────────────────────────
  const THEME_KEY    = 'pollenTheme';
  const THEME_LABELS = { system: 'Automatisch', light: 'Hell', dark: 'Dunkel' };
  const THEME_ORDER  = ['system', 'light', 'dark'];

  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    const label = document.getElementById('themeToggleLabel');
    if (label) label.textContent = THEME_LABELS[theme] ?? THEME_LABELS.system;
  }

  function initTheme() {
    let saved = 'system';
    try { saved = localStorage.getItem(THEME_KEY) || 'system'; } catch {}
    applyTheme(saved);
  }

  document.getElementById('themeToggle')?.addEventListener('click', () => {
    let current = 'system';
    try { current = localStorage.getItem(THEME_KEY) || 'system'; } catch {}
    const next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    applyTheme(next);
  });

  // ─── Init ────────────────────────────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        // Non-critical: app shell caching / Android install-prompt only, no user-facing impact.
      });
    });
  }

  setupDateLabels();
  initTheme();

  const cached = loadCache();
  if (cached) {
    state.locationKey   = cached.locationKey ?? state.locationKey;
    state.customCoords  = cached.customCoords ?? null;
    state.data          = cached.data;
    state.dataTimestamp = cached.dataTimestamp ?? null;
    document.getElementById('locationName').textContent =
      cached.locationName || LOCATIONS[state.locationKey]?.name || 'Standort';
    render();
    requestGeo({ background: true });
  } else {
    requestGeo();
  }
  } // end: window.PollenLogic guard
  </script>
</body>
</html>
