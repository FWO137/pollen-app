<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090B09" media="(prefers-color-scheme: dark)">
  <title>Pollenflug</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #F3F4F1;
      --bdr:  rgba(0,0,0,0.08);
      --t1:   #111410;
      --t2:   rgba(17,20,16,0.50);
      --t3:   rgba(17,20,16,0.26);

      --c-none: #9CA3AF;
      --c-low:  #15803D;
      --c-med:  #B45309;
      --c-high: #C2410C;
      --c-vhi:  #B91C1C;

      --accent: #9A6F00;
      --glow-a: 0.065;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:   #090B09;
        --bdr:  rgba(255,255,255,0.08);
        --t1:   #E6E8E3;
        --t2:   rgba(230,232,227,0.46);
        --t3:   rgba(230,232,227,0.24);

        --c-none: #6B7280;
        --c-low:  #4ADE80;
        --c-med:  #FBBF24;
        --c-high: #FB923C;
        --c-vhi:  #F87171;

        --accent: #CCA020;
        --glow-a: 0.14;
      }
    }
    :root[data-theme="dark"] {
      --bg:   #090B09; --bdr: rgba(255,255,255,0.08);
      --t1:   #E6E8E3; --t2: rgba(230,232,227,0.46); --t3: rgba(230,232,227,0.24);
      --c-none: #6B7280; --c-low: #4ADE80; --c-med: #FBBF24;
      --c-high: #FB923C; --c-vhi: #F87171;
      --accent: #CCA020; --glow-a: 0.14;
    }

    html { background: var(--bg); }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      overflow-x: hidden;
    }

    /* ── Atmospheric glow ── */
    .glow-ring {
      position: fixed;
      top: -80px; left: 50%;
      transform: translateX(-50%);
      width: 800px; height: 440px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      transition: background 1s ease;
    }
    .glow-ring.l-none     { background: radial-gradient(ellipse at 50% 30%, rgba(156,163,175,var(--glow-a)) 0%, transparent 65%); }
    .glow-ring.l-low      { background: radial-gradient(ellipse at 50% 30%, rgba(74,222,128,var(--glow-a))  0%, transparent 65%); }
    .glow-ring.l-medium   { background: radial-gradient(ellipse at 50% 30%, rgba(251,191,36,var(--glow-a))  0%, transparent 65%); }
    .glow-ring.l-high     { background: radial-gradient(ellipse at 50% 30%, rgba(251,146,60,var(--glow-a))  0%, transparent 65%); }
    .glow-ring.l-very-high{ background: radial-gradient(ellipse at 50% 30%, rgba(248,113,113,var(--glow-a)) 0%, transparent 65%); }

    /* ── App shell ── */
    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top, 0px) + 28px)
        calc(env(safe-area-inset-right, 0px) + 22px)
        calc(env(safe-area-inset-bottom, 0px) + 64px)
        calc(env(safe-area-inset-left, 0px) + 22px);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 52px;
    }

    .location-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--t2);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
      -webkit-user-select: none;
      user-select: none;
    }
    .location-btn.loading { opacity: 0.4; pointer-events: none; }

    .loc-pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--t3);
      flex-shrink: 0;
      transition: background 0.4s ease;
    }
    /* color the dot when data is loaded — JS adds a level class to .header */
    .header.l-none     .loc-pulse { background: var(--c-none); }
    .header.l-low      .loc-pulse { background: var(--c-low);  }
    .header.l-medium   .loc-pulse { background: var(--c-med);  }
    .header.l-high     .loc-pulse { background: var(--c-high); }
    .header.l-very-high.loc-pulse { background: var(--c-vhi);  }

    /* ── Day tabs ── */
    .day-tabs {
      display: flex;
      gap: 20px;
    }

    .day-tab {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--t3);
      background: none;
      border: none;
      padding: 4px 0;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
      transition: color 0.15s;
    }
    .day-tab.active { color: var(--t1); font-weight: 700; }

    .tab-date {
      font-size: 10px;
      font-weight: 400;
      color: var(--t3);
    }
    .day-tab.active .tab-date { color: var(--t2); }

    /* ── Hero (built by JS into #summary) ── */
    .hero { margin-bottom: 52px; }

    .hero-eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--t3);
      margin-bottom: 10px;
    }

    .hero-level {
      font-size: clamp(52px, 16vw, 76px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.88;
      margin-bottom: 18px;
      transition: color 0.5s ease;
    }
    .hero-level.l-none      { color: var(--c-none); }
    .hero-level.l-low       { color: var(--c-low);  }
    .hero-level.l-medium    { color: var(--c-med);  }
    .hero-level.l-high      { color: var(--c-high); }
    .hero-level.l-very-high { color: var(--c-vhi);  }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--t2);
    }
    .hero-meta strong { font-weight: 600; color: var(--t1); }
    .hero-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--t3); flex-shrink: 0; }

    /* ── Pollen list (built by JS into #content) ── */
    .list-head {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--t3);
      margin-bottom: 2px;
    }

    .pollen-list { display: flex; flex-direction: column; }

    .p-row {
      display: grid;
      grid-template-columns: 80px 1fr 76px;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid var(--bdr);
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .p-row:nth-child(1)  { animation-delay:  0ms; }
    .p-row:nth-child(2)  { animation-delay: 30ms; }
    .p-row:nth-child(3)  { animation-delay: 60ms; }
    .p-row:nth-child(4)  { animation-delay: 90ms; }
    .p-row:nth-child(5)  { animation-delay:120ms; }

    .p-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--t1);
      white-space: nowrap;
    }

    .p-track {
      height: 2px;
      border-radius: 1px;
      background: var(--bdr);
      position: relative;
      overflow: hidden;
    }
    .p-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--pct, 0%);
      border-radius: 1px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .l-none     .p-fill { background: var(--c-none); opacity: 0.35; }
    .l-low      .p-fill { background: var(--c-low);  }
    .l-medium   .p-fill { background: var(--c-med);  }
    .l-high     .p-fill { background: var(--c-high); }
    .l-very-high.p-fill { background: var(--c-vhi);  }
    .p-row.l-very-high .p-fill { background: var(--c-vhi); }

    .p-val {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
      transition: color 0.5s ease;
    }
    .p-val .u { font-size: 10px; font-weight: 400; color: var(--t3); margin-left: 2px; }

    .p-row.l-none      .p-val { color: var(--t3); font-weight: 400; }
    .p-row.l-low       .p-val { color: var(--c-low);  }
    .p-row.l-medium    .p-val { color: var(--c-med);  }
    .p-row.l-high      .p-val { color: var(--c-high); }
    .p-row.l-very-high .p-val { color: var(--c-vhi);  }

    /* ── No-pollen group ── */
    .no-pollen {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      padding: 13px 0 0;
    }
    .np-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--t3); white-space: nowrap;
    }
    .np-list { font-size: 12px; color: var(--t3); line-height: 1.7; }

    /* ── Stand / source line ── */
    .stand-line {
      margin-top: 20px;
      font-size: 11px;
      color: var(--t3);
      line-height: 1.7;
    }

    /* ── State views ── */
    .state-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 12px;
    }
    .state-view p { font-size: 14px; color: var(--t2); text-align: center; }
    .state-view .err-detail { font-size: 11px; color: var(--t3); }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--bdr);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      margin-top: 4px;
      background: var(--t1);
      color: var(--bg);
      border: none;
      border-radius: 22px;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
    }

    /* ── Location picker ── */
    .location-picker { padding: 4px 0 8px; }

    .picker-hint {
      font-size: 14px; color: var(--t2); line-height: 1.55; margin-bottom: 24px;
    }
    .picker-hint strong { color: var(--t1); display: block; font-size: 16px; margin-bottom: 4px; }

    .picker-section { margin-bottom: 20px; }
    .picker-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--t3); margin-bottom: 10px;
    }
    .picker-pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .picker-pill {
      background: none;
      border: 1px solid var(--bdr);
      border-radius: 20px;
      padding: 7px 15px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--t1); cursor: pointer;
      touch-action: manipulation; min-height: 36px;
      -webkit-user-select: none; user-select: none;
    }
    .picker-pill:active { opacity: 0.6; }

    .picker-retry {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none;
      font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--accent); cursor: pointer;
      touch-action: manipulation; padding: 0; min-height: 44px; margin-bottom: 20px;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 48px;
      font-size: 11px;
      color: var(--t3);
      line-height: 2.0;
    }
    .footer a { color: var(--t3); text-decoration: underline; text-decoration-color: var(--bdr); }
  </style>
</head>
<body>

  <!-- Atmospheric level glow -->
  <div class="glow-ring" id="glowRing"></div>

  <div class="app">

    <header class="header" id="appHeader">
      <button class="location-btn" id="geoBtn" aria-label="Standort aktualisieren">
        <span class="loc-pulse"></span>
        <span id="locationName">Standort ermitteln …</span>
      </button>
      <nav class="day-tabs" id="dayTabs" aria-label="Tagauswahl">
        <button class="day-tab active" data-day="0">
          Heute
          <span class="tab-date" id="tabDate0"></span>
        </button>
        <button class="day-tab" data-day="1">
          Morgen
          <span class="tab-date" id="tabDate1"></span>
        </button>
        <button class="day-tab" data-day="2">
          Üb.
          <span class="tab-date" id="tabDate2"></span>
        </button>
      </nav>
    </header>

    <!-- Hero (populated by render()) -->
    <div id="summary" style="display:none;"></div>

    <!-- Pollen list (populated by render()) -->
    <div id="content"></div>

    <footer class="footer">
      <a href="https://www.dwd.de" target="_blank" rel="noopener">DWD</a> ·
      <a href="https://epin.lgl.bayern.de" target="_blank" rel="noopener">LGL Bayern ePIN</a> ·
      <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><br>
      Kein Ersatz für ärztlichen Rat
    </footer>

  </div>

  <script>
  // ─── Locations ───────────────────────────────────────────────────────────────
  const LOCATIONS = {
    pfarrkirchen: { name: 'Pfarrkirchen', lat: 48.4320, lon: 12.9386, country: 'DE', dwd: 122, lgl: 'DEALTO' },
    munich:       { name: 'München',      lat: 48.1351, lon: 11.5820, country: 'DE', dwd: 121, lgl: 'DEMUNC' },
    nuremberg:    { name: 'Nürnberg',     lat: 49.4521, lon: 11.0767, country: 'DE', dwd: 123, lgl: 'DEFEUC' },
    augsburg:     { name: 'Augsburg',     lat: 48.3705, lon: 10.8978, country: 'DE', dwd: 121, lgl: 'DEMIND' },
    ingolstadt:   { name: 'Ingolstadt',   lat: 48.7665, lon: 11.4258, country: 'DE', dwd: 121, lgl: 'DEMUNC' },
    regensburg:   { name: 'Regensburg',   lat: 49.0134, lon: 12.1016, country: 'DE', dwd: 123, lgl: 'DEVIEC' },
    stuttgart:    { name: 'Stuttgart',    lat: 48.7758, lon:  9.1829, country: 'DE', dwd: 112, lgl: null     },
    freiburg:     { name: 'Freiburg',     lat: 47.9990, lon:  7.8421, country: 'DE', dwd: 111, lgl: null     },
    ulm:          { name: 'Ulm',          lat: 48.4011, lon:  9.9876, country: 'DE', dwd: 112, lgl: 'DEMIND' },
    constance:    { name: 'Konstanz',     lat: 47.6631, lon:  9.1756, country: 'DE', dwd: 112, lgl: null     },
    vienna:       { name: 'Wien',         lat: 48.2082, lon: 16.3738, country: 'AT', dwd: null, lgl: null    },
    salzburg:     { name: 'Salzburg',     lat: 47.8095, lon: 13.0550, country: 'AT', dwd: null, lgl: null    },
    innsbruck:    { name: 'Innsbruck',    lat: 47.2692, lon: 11.4041, country: 'AT', dwd: null, lgl: null    },
    graz:         { name: 'Graz',         lat: 47.0707, lon: 15.4395, country: 'AT', dwd: null, lgl: null    },
    linz:         { name: 'Linz',         lat: 48.3069, lon: 14.2858, country: 'AT', dwd: null, lgl: null    },
    klagenfurt:   { name: 'Klagenfurt',   lat: 46.6228, lon: 14.3051, country: 'AT', dwd: null, lgl: null    },
    bregenz:      { name: 'Bregenz',      lat: 47.5031, lon:  9.7471, country: 'AT', dwd: null, lgl: null    },
  };

  // ─── Pollen types ────────────────────────────────────────────────────────────
  const POLLEN = [
    { key: 'hazel',   name: 'Hasel',    en: 'Hazel',   season: 'Jan – Mär', icon: '🌰', dwd: 'Hasel',    om: null              },
    { key: 'alder',   name: 'Erle',     en: 'Alder',   season: 'Jan – Apr', icon: '🌳', dwd: 'Erle',     om: 'alder_pollen'    },
    { key: 'ash',     name: 'Esche',    en: 'Ash',     season: 'Mär – Mai', icon: '🌿', dwd: 'Esche',    om: null              },
    { key: 'birch',   name: 'Birke',    en: 'Birch',   season: 'Apr – Mai', icon: '🌲', dwd: 'Birke',    om: 'birch_pollen'    },
    { key: 'plane',   name: 'Platane',  en: 'Plane',   season: 'Apr – Mai', icon: '🌴', dwd: null,       om: null              },
    { key: 'olive',   name: 'Olive',    en: 'Olive',   season: 'Mai – Jun', icon: '🫒', dwd: null,       om: 'olive_pollen'    },
    { key: 'grass',   name: 'Gräser',   en: 'Grass',   season: 'Mai – Sep', icon: '🌾', dwd: 'Graeser',  om: 'grass_pollen'    },
    { key: 'rye',     name: 'Roggen',   en: 'Rye',     season: 'Mai – Jun', icon: '🌻', dwd: 'Roggen',   om: null              },
    { key: 'mugwort', name: 'Beifuß',   en: 'Mugwort', season: 'Jul – Sep', icon: '🍃', dwd: 'Beifuss',  om: 'mugwort_pollen'  },
    { key: 'ragweed', name: 'Ambrosia', en: 'Ragweed', season: 'Aug – Okt', icon: '🌱', dwd: 'Ambrosia', om: 'ragweed_pollen'  },
  ];

  const LGL_MAP = {
    Alnus: 'alder', Betula: 'birch', Platanus: 'plane', Fraxinus: 'ash',
    Corylus: 'hazel', Poaceae: 'grass', Secale: 'rye',
    Artemisia: 'mugwort', Ambrosia: 'ragweed',
  };

  const LGL_THR = {
    Alnus:    [1,  20, 200, 1000],
    Betula:   [1,  20, 200, 1000],
    Platanus: [1,  20, 200, 1000],
    Fraxinus: [1,  20, 200, 1000],
    Corylus:  [1,  20, 200, 1000],
    Poaceae:  [1,  10, 100,  500],
    Secale:   [1,  10, 100,  500],
    Artemisia:[1,  20, 200, 1000],
    Ambrosia: [1,  10,  50,  200],
  };

  const OM_THR = {
    alder_pollen:   [15,  90,  500],
    birch_pollen:   [15,  90, 1500],
    grass_pollen:   [10,  50,  200],
    mugwort_pollen: [10,  50,  200],
    ragweed_pollen: [10,  50,  200],
    olive_pollen:   [10,  50,  200],
  };

  const DWD_MAP = {
    '0':   { level: 'none',   num: 0   },
    '0-1': { level: 'low',    num: 0.5 },
    '1':   { level: 'low',    num: 1   },
    '1-2': { level: 'medium', num: 1.5 },
    '2':   { level: 'medium', num: 2   },
    '2-3': { level: 'high',   num: 2.5 },
    '3':   { level: 'high',   num: 3   },
  };

  const LEVELS      = ['none', 'low', 'medium', 'high', 'very-high'];
  const SUMMARY_DE  = { none: 'Kaum Belastung', low: 'Geringe Belastung', medium: 'Mittlere Belastung', high: 'Hohe Belastung', 'very-high': 'Sehr hohe Belastung' };

  // ─── State ───────────────────────────────────────────────────────────────────
  const state = {
    locationKey:   'munich',
    selectedDay:   0,
    data:          null,
    customCoords:  null,
    dataTimestamp: null,
  };

  let dwdCache = null;
  let lglCache = null;

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  function highestLevel(levels) {
    return levels.reduce((best, l) =>
      LEVELS.indexOf(l) > LEVELS.indexOf(best) ? l : best, 'none');
  }

  function fmtDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr + 'T12:00:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  }

  function fmtDataTimestamp(ts) {
    if (!ts) return '';
    let date, timeStr;
    if (/^\d{4}-\d{2}-\d{2}T/.test(ts)) {
      date = new Date(ts);
      timeStr = date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
    } else {
      const [datePart, ...rest] = ts.split(' ');
      date = new Date(datePart + 'T12:00:00');
      const m = ts.match(/\d{2}:\d{2}/);
      timeStr = m ? m[0] : null;
    }
    const dateStr = date.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', timeZone: 'Europe/Berlin' });
    return timeStr ? `${dateStr}, ${timeStr} Uhr` : dateStr;
  }

  // ─── DWD API ─────────────────────────────────────────────────────────────────
  const DWD_URL = 'https://opendata.dwd.de/climate_environment/health/alerts/s31fg.json';
  function dwdFetchUrl() {
    return location.hostname.endsWith('.netlify.app') || location.hostname.endsWith('.netlify.com')
      ? '/dwd-api'
      : `https://cors.eu.org/${DWD_URL}`;
  }

  async function fetchDWD() {
    if (dwdCache) return dwdCache;
    const r = await fetch(dwdFetchUrl());
    if (!r.ok) throw new Error('DWD ' + r.status);
    dwdCache = await r.json();
    return dwdCache;
  }

  function parseDwdVal(str) {
    if (!str || str === '-1') return null;
    const e = DWD_MAP[str];
    if (!e) return null;
    const display = Number.isInteger(e.num) ? String(e.num) : e.num.toFixed(1);
    return { level: e.level, display, unit: '/ 3', source: 'dwd', pct: Math.round(e.num / 3 * 100) };
  }

  function extractDWDDays(raw, partregionId) {
    const region = raw.content.find(r => r.partregion_id === partregionId);
    if (!region) return null;
    const base = new Date(raw.last_update.split(' ')[0] + 'T12:00:00');
    const p = region.Pollen;
    const days = ['today', 'tomorrow', 'dayafter_to'].map((field, i) => {
      const d = new Date(base);
      d.setDate(d.getDate() + i);
      return {
        date: d.toISOString().split('T')[0],
        dwd: {
          hazel:   parseDwdVal(p.Hasel?.[field]),
          alder:   parseDwdVal(p.Erle?.[field]),
          ash:     parseDwdVal(p.Esche?.[field]),
          birch:   parseDwdVal(p.Birke?.[field]),
          grass:   parseDwdVal(p.Graeser?.[field]),
          rye:     parseDwdVal(p.Roggen?.[field]),
          mugwort: parseDwdVal(p.Beifuss?.[field]),
          ragweed: parseDwdVal(p.Ambrosia?.[field]),
        },
      };
    });
    return { days, lastUpdate: raw.last_update };
  }

  // ─── Open-Meteo API ───────────────────────────────────────────────────────────
  async function fetchOM(lat, lon) {
    const vars = POLLEN.filter(p => p.om).map(p => p.om).join(',');
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality`
      + `?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=auto&forecast_days=3`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Open-Meteo ' + r.status);
    return r.json();
  }

  function processOM(raw) {
    const times = raw.hourly.time;
    const byDay = {};
    for (let i = 0; i < times.length; i++) {
      const date = times[i].split('T')[0];
      if (!byDay[date]) byDay[date] = { date };
      for (const p of POLLEN) {
        if (!p.om) continue;
        const v = raw.hourly[p.om]?.[i] ?? 0;
        byDay[date][p.key] = Math.max(byDay[date][p.key] ?? 0, v || 0);
      }
    }
    return Object.values(byDay)
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(day => {
        const om = {};
        for (const p of POLLEN) {
          if (!p.om) continue;
          const v = day[p.key] || 0;
          const thr = OM_THR[p.om] || [10, 50, 200];
          const level = v < 0.5 ? 'none'
            : v < thr[0] ? 'low'
            : v < thr[1] ? 'medium'
            : v < thr[2] ? 'high' : 'very-high';
          const display = v < 1 ? '0' : Math.round(v).toLocaleString('de-DE');
          let pct;
          if (v < 0.5)         pct = 0;
          else if (v < thr[0]) pct = Math.round((v / thr[0]) * 33);
          else if (v < thr[1]) pct = Math.round(33 + (v - thr[0]) / (thr[1] - thr[0]) * 33);
          else                 pct = Math.min(Math.round(66 + (v - thr[1]) / (thr[2] - thr[1]) * 34), 100);
          om[p.key] = { level, display, unit: 'K/m³', source: 'om', pct };
        }
        return { date: day.date, om };
      });
  }

  // ─── LGL Bayern ePIN API ─────────────────────────────────────────────────────
  const LGL_URL = 'https://epin.lgl.bayern.de/api/measurements';
  function lglFetchUrl() {
    return location.hostname.endsWith('.netlify.app') || location.hostname.endsWith('.netlify.com')
      ? '/lgl-api'
      : `https://cors.eu.org/${LGL_URL}`;
  }

  async function fetchLGL() {
    if (lglCache) return lglCache;
    const r = await fetch(lglFetchUrl());
    if (!r.ok) throw new Error('LGL ' + r.status);
    lglCache = await r.json();
    return lglCache;
  }

  function processLGL(raw, stationId) {
    const result = {};
    let maxToTs = null;
    for (const m of raw.measurements) {
      if (m.location !== stationId) continue;
      const appKey = LGL_MAP[m.polle];
      if (!appKey) continue;
      const maxVal = Math.max(...m.data.map(d => d.value || 0));
      for (const d of m.data) {
        if (d.to != null && (maxToTs == null || d.to > maxToTs)) maxToTs = d.to;
      }
      const thr = LGL_THR[m.polle] || [1, 20, 200, 1000];
      const level = maxVal < thr[0] ? 'none'
        : maxVal < thr[1] ? 'low'
        : maxVal < thr[2] ? 'medium'
        : maxVal < thr[3] ? 'high' : 'very-high';
      const display = maxVal < 1 ? '0' : Math.round(maxVal).toLocaleString('de-DE');
      let pct;
      if (maxVal < thr[0])      pct = Math.round((maxVal / thr[0]) * 33);
      else if (maxVal < thr[1]) pct = Math.round(33 + (maxVal - thr[0]) / (thr[1] - thr[0]) * 33);
      else if (maxVal < thr[2]) pct = Math.round(66 + (maxVal - thr[1]) / (thr[2] - thr[1]) * 17);
      else                      pct = Math.min(Math.round(83 + (maxVal - thr[2]) / (thr[3] - thr[2]) * 17), 100);
      result[appKey] = { level, display, unit: 'K/m³', source: 'lgl', pct };
    }
    const dataDate = maxToTs != null ? new Date(maxToTs * 1000).toISOString() : null;
    return Object.keys(result).length > 0 ? { data: result, dataDate } : null;
  }

  // ─── Merge ───────────────────────────────────────────────────────────────────
  function buildDays(dwdDays, omDays, lglToday = null) {
    const len = Math.max(dwdDays?.length ?? 0, omDays?.length ?? 0, 3);
    return Array.from({ length: len }, (_, i) => {
      const dwd  = dwdDays?.[i]?.dwd;
      const om   = omDays?.[i]?.om;
      const lgl  = i === 0 ? lglToday : null;
      const date = dwdDays?.[i]?.date ?? omDays?.[i]?.date;
      const pollens = {};
      for (const p of POLLEN) {
        if (lgl?.[p.key] != null) {
          pollens[p.key] = lgl[p.key];
        } else if (dwd?.[p.key] != null) {
          const entry = { ...dwd[p.key] };
          if (om?.[p.key]) entry.omDisplay = om[p.key].display;
          pollens[p.key] = entry;
        } else if (om?.[p.key] != null) {
          pollens[p.key] = om[p.key];
        } else {
          pollens[p.key] = null;
        }
      }
      return { date, pollens };
    });
  }

  // ─── Load ────────────────────────────────────────────────────────────────────
  async function loadData() {
    showLoading();
    const snapped = LOCATIONS[state.locationKey];
    const loc = state.customCoords
      ? {
          lat: state.customCoords.lat,
          lon: state.customCoords.lon,
          country: snapped?.country ?? 'DE',
          dwd: snapped?.dwd ?? null,
          lgl: snapped?.lgl ?? null,
        }
      : snapped;

    try {
      let dwdDays = null, omDays = null, lglToday = null;
      const lglStation = loc.lgl ?? null;

      if (loc.country === 'DE' && loc.dwd != null) {
        const [dwdResult, omResult, lglResult] = await Promise.allSettled([
          fetchDWD().then(raw => extractDWDDays(raw, loc.dwd)),
          fetchOM(loc.lat, loc.lon).then(processOM),
          lglStation ? fetchLGL().then(raw => processLGL(raw, lglStation)) : Promise.resolve(null),
        ]);
        const dwdVal       = dwdResult.status === 'fulfilled' ? dwdResult.value : null;
        dwdDays            = dwdVal?.days ?? null;
        const dwdLastUpdate = dwdVal?.lastUpdate ?? null;
        omDays             = omResult.status === 'fulfilled' ? omResult.value : null;
        const lglVal       = lglResult.status === 'fulfilled' ? lglResult.value : null;
        lglToday           = lglVal?.data ?? null;
        const lglDataDate  = lglVal?.dataDate ?? null;
        if (dwdDays === null && omDays === null && lglToday === null)
          throw new Error('Alle Datenquellen nicht verfügbar');
        state.dataTimestamp = lglDataDate ?? dwdLastUpdate ?? null;
      } else {
        const omRaw = await fetchOM(loc.lat, loc.lon);
        omDays = processOM(omRaw);
        state.dataTimestamp = null;
      }

      state.data = buildDays(dwdDays, omDays, lglToday);
      render();
    } catch (err) {
      showError(err.message);
    }
  }

  // ─── Location picker ─────────────────────────────────────────────────────────
  function showLocationPicker(permissionDenied) {
    document.getElementById('locationName').textContent = 'Standort wählen';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('glowRing').className = 'glow-ring';

    const DE_KEYS = ['pfarrkirchen','munich','nuremberg','augsburg','ingolstadt','regensburg','stuttgart','freiburg','ulm','constance'];
    const AT_KEYS = ['vienna','salzburg','innsbruck','graz','linz','klagenfurt','bregenz'];
    const pills = keys => keys.map(k =>
      `<button class="picker-pill" data-key="${k}">${LOCATIONS[k].name}</button>`
    ).join('');

    const retryRow = permissionDenied ? '' : `
      <button class="picker-retry" id="retryGeoBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Standort erneut ermitteln
      </button>`;

    const hint = permissionDenied
      ? '<strong>Standortzugriff nicht erlaubt</strong>In Safari: Adressleiste → <b>AA</b> → Website-Einstellungen → Standort → <b>Erlauben</b>. Danach diese Seite neu laden.'
      : '<strong>Standort nicht ermittelbar</strong>Prüfe unter Einstellungen → Datenschutz &amp; Sicherheit → Ortungsdienste, dass die Ortungsdienste sowie der Zugriff für Safari aktiviert sind. Oder wähle einen Ort:';

    document.getElementById('content').innerHTML = `
      <div class="location-picker">
        <p class="picker-hint">${hint}</p>
        ${retryRow}
        <div class="picker-section">
          <div class="picker-section-label">Bayern &amp; Baden-Württemberg</div>
          <div class="picker-pills">${pills(DE_KEYS)}</div>
        </div>
        <div class="picker-section">
          <div class="picker-section-label">Österreich</div>
          <div class="picker-pills">${pills(AT_KEYS)}</div>
        </div>
      </div>`;

    document.getElementById('content').addEventListener('click', e => {
      if (e.target.closest('#retryGeoBtn')) { requestGeo(); return; }
      const pill = e.target.closest('.picker-pill');
      if (!pill) return;
      state.locationKey  = pill.dataset.key;
      state.customCoords = null;
      document.getElementById('locationName').textContent = LOCATIONS[pill.dataset.key].name;
      loadData();
    });
  }

  // ─── Geolocation ─────────────────────────────────────────────────────────────
  function requestGeo() {
    const btn    = document.getElementById('geoBtn');
    const nameEl = document.getElementById('locationName');

    if (!navigator.geolocation) { showLocationPicker(false); return; }

    btn.classList.add('loading');
    nameEl.textContent = 'Standort wird ermittelt …';
    showLoading();

    const onSuccess = ({ coords }) => {
      btn.classList.remove('loading');
      let nearest = 'munich', nearestDist = Infinity;
      for (const [key, loc] of Object.entries(LOCATIONS)) {
        const d = Math.hypot(loc.lat - coords.latitude, loc.lon - coords.longitude);
        if (d < nearestDist) { nearestDist = d; nearest = key; }
      }
      state.locationKey  = nearest;
      state.customCoords = { lat: coords.latitude, lon: coords.longitude };
      nameEl.textContent = LOCATIONS[nearest].name;
      loadData();
    };

    const onFinalError = (err) => {
      btn.classList.remove('loading');
      showLocationPicker(err.code === 1);
    };

    navigator.geolocation.getCurrentPosition(
      onSuccess,
      (err) => {
        // iOS frequently times out or reports POSITION_UNAVAILABLE on the
        // first high-accuracy fix (cold GPS start, indoors, weak signal).
        // Retry once with relaxed accuracy and a longer timeout before
        // giving up. A permission denial won't change on retry, so skip
        // straight to the picker in that case.
        if (err.code === 1) { onFinalError(err); return; }
        navigator.geolocation.getCurrentPosition(
          onSuccess,
          onFinalError,
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 }
        );
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 300000 }
    );
  }

  // ─── Render ──────────────────────────────────────────────────────────────────
  function setGlow(level) {
    document.getElementById('glowRing').className = `glow-ring l-${level}`;
  }

  function showLoading() {
    setGlow('');
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <div class="spinner"></div>
        <p>Pollendaten werden geladen …</p>
      </div>`;
  }

  function showError(msg) {
    setGlow('');
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <p style="font-size:24px">⚠️</p>
        <p>Daten konnten nicht geladen werden.</p>
        <p class="err-detail">${msg}</p>
        <button class="retry-btn" onclick="location.reload()">Neu laden</button>
      </div>`;
  }

  function render() {
    if (!state.data?.length) return showError('Keine Daten verfügbar');
    const dayData = state.data[state.selectedDay];
    if (!dayData) return showError('Prognosedaten nicht verfügbar');

    // Update tab dates
    state.data.forEach((day, i) => {
      const el = document.getElementById(`tabDate${i}`);
      if (el && day?.date) el.textContent = fmtDate(day.date);
    });

    // Overall level & dominant pollen
    const levelsWithData = POLLEN
      .filter(p => dayData.pollens[p.key] !== null)
      .map(p => dayData.pollens[p.key]?.level ?? 'none');
    const overall = highestLevel(levelsWithData);

    let dominant = null, domIdx = -1;
    for (const p of POLLEN) {
      const entry = dayData.pollens[p.key];
      if (!entry) continue;
      const idx = LEVELS.indexOf(entry.level);
      if (idx > domIdx) { domIdx = idx; dominant = p; }
    }

    // Glow
    setGlow(overall);

    // Sources & stand
    const SOURCE_LABELS = { lgl: 'LGL Bayern ePIN', dwd: 'DWD', om: 'Open-Meteo' };
    const usedSources = new Set();
    for (const p of POLLEN) {
      const src = dayData.pollens[p.key]?.source;
      if (src) usedSources.add(src);
    }
    const sourceText = [...usedSources].map(s => SOURCE_LABELS[s] || s).join(' · ');
    const standText  = fmtDataTimestamp(state.dataTimestamp);

    // ── Hero ──
    const words = SUMMARY_DE[overall].split(' ');
    const heroHtml = words.slice(0, -1).join(' ') + '<br>' + words[words.length - 1];
    const dominantLabel = dominant && domIdx > 0
      ? `Hauptbelastung: <strong>${dominant.name}</strong>`
      : 'Keine aktiven Pollen';

    const summaryEl = document.getElementById('summary');
    summaryEl.style.display = 'block';
    summaryEl.innerHTML = `
      <div class="hero">
        <div class="hero-eyebrow">Pollenbelastung</div>
        <div class="hero-level l-${overall}">${heroHtml}</div>
        <div class="hero-meta">
          <span>${fmtDate(dayData.date)}</span>
          <span class="hero-sep"></span>
          <span>${dominantLabel}</span>
        </div>
      </div>`;

    // ── Pollen list ──
    const sortedPollen = [...POLLEN].sort((a, b) => {
      const aE = dayData.pollens[a.key];
      const bE = dayData.pollens[b.key];
      if (!aE && !bE) return 0; if (!aE) return 1; if (!bE) return -1;
      return LEVELS.indexOf(bE.level) - LEVELS.indexOf(aE.level);
    });

    const active   = sortedPollen.filter(p => dayData.pollens[p.key]?.level !== 'none' && dayData.pollens[p.key] !== null);
    const noFlight = sortedPollen.filter(p => !dayData.pollens[p.key] || dayData.pollens[p.key].level === 'none');

    const wrap = document.createElement('div');

    const lh = document.createElement('div');
    lh.className = 'list-head';
    lh.textContent = 'Pollenarten';
    wrap.appendChild(lh);

    const list = document.createElement('div');
    list.className = 'pollen-list';

    for (const p of active) {
      const entry = dayData.pollens[p.key];
      const row = document.createElement('div');
      row.className = `p-row l-${entry.level}`;
      row.style.setProperty('--pct', `${entry.pct ?? 0}%`);
      row.innerHTML = `
        <div class="p-name">${p.name}</div>
        <div class="p-track"><div class="p-fill"></div></div>
        <div class="p-val">${entry.display}<span class="u">${entry.unit}</span></div>`;
      list.appendChild(row);
    }

    if (noFlight.length > 0) {
      const nf = document.createElement('div');
      nf.className = 'no-pollen';
      nf.innerHTML = `
        <span class="np-label">Kein Flug</span>
        <span class="np-list">${noFlight.map(p => p.name).join(' · ')}</span>`;
      list.appendChild(nf);
    }

    wrap.appendChild(list);

    const sl = document.createElement('div');
    sl.className = 'stand-line';
    sl.textContent = sourceText + (standText ? ' · Stand: ' + standText : '');
    wrap.appendChild(sl);

    document.getElementById('content').replaceChildren(wrap);
  }

  // ─── Tabs & date labels ───────────────────────────────────────────────────────
  function setupDateLabels() {
    const today = new Date();
    for (let i = 0; i < 3; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const el = document.getElementById(`tabDate${i}`);
      if (el) el.textContent = d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
    }
  }

  function syncTabs() {
    document.querySelectorAll('.day-tab').forEach(t => {
      t.classList.toggle('active', parseInt(t.dataset.day) === state.selectedDay);
    });
  }

  // ─── Events ──────────────────────────────────────────────────────────────────
  document.getElementById('dayTabs').addEventListener('click', e => {
    const tab = e.target.closest('.day-tab');
    if (!tab) return;
    state.selectedDay = parseInt(tab.dataset.day, 10);
    syncTabs();
    render();
  });

  document.getElementById('geoBtn').addEventListener('click', () => {
    dwdCache = null;
    lglCache = null;
    state.data = null;
    state.dataTimestamp = null;
    requestGeo();
  });

  // ─── Init ────────────────────────────────────────────────────────────────────
  setupDateLabels();
  requestGeo();
  </script>
</body>
</html>
