<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Pollenflug</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light dark;
      --bg:        #F2F2F7;
      --surface:   #FFFFFF;
      --surface2:  #E5E5EA;
      --sep:       rgba(60,60,67,0.13);
      --text-1:    #000000;
      --text-2:    rgba(60,60,67,0.60);
      --text-3:    rgba(60,60,67,0.36);
      --accent:    #007AFF;

      --c-none:     rgba(120,120,128,0.28);
      --c-low:      #34C759;
      --c-low-t:    #1A7A35;
      --c-med:      #FF9F0A;
      --c-med-t:    #A85900;
      --c-high:     #FF6B00;
      --c-high-t:   #C03500;
      --c-vhi:      #FF3B30;
      --c-vhi-t:    #B5281F;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #000000;
        --surface:  #1C1C1E;
        --surface2: #2C2C2E;
        --sep:      rgba(84,84,88,0.65);
        --text-1:   #FFFFFF;
        --text-2:   rgba(235,235,245,0.60);
        --text-3:   rgba(235,235,245,0.36);
        --accent:   #0A84FF;

        --c-low-t:  #34C759;
        --c-med-t:  #FF9F0A;
        --c-high-t: #FF6B00;
        --c-vhi-t:  #FF3B30;
      }
    }

    html { background: var(--bg); }

    body {
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top, 0px) + 24px)
        calc(env(safe-area-inset-right, 0px) + 16px)
        calc(env(safe-area-inset-bottom, 0px) + 48px)
        calc(env(safe-area-inset-left, 0px) + 16px);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .app-title {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .location-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: 4px 0;
      margin-top: 4px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      touch-action: manipulation;
      min-height: 44px;
      -webkit-user-select: none;
      user-select: none;
    }

    .location-btn.loading { opacity: 0.45; pointer-events: none; }

    .app-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(150deg, #5AC85A 0%, #34C759 100%);
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(52,199,89,0.35);
    }

    /* ── Segmented Control ── */
    .segmented {
      display: flex;
      background: var(--surface2);
      border-radius: 10px;
      padding: 2px;
      margin-bottom: 20px;
      gap: 2px;
    }

    .seg {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 6px 4px 7px;
      min-height: 44px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-1);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .seg.active {
      background: var(--surface);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.14);
    }

    @media (prefers-color-scheme: dark) {
      .seg.active { box-shadow: 0 1px 4px rgba(0,0,0,0.55); }
    }

    .seg-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-3);
    }
    .seg.active .seg-sub { color: var(--text-2); }

    /* ── Summary ── */
    .summary {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 2px 14px rgba(0,0,0,0.05);
    }

    @media (prefers-color-scheme: dark) {
      .summary { box-shadow: none; }
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-left { display: flex; align-items: center; gap: 11px; }

    .summary-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .summary-text strong {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: block;
    }

    .summary-text .s-date { font-size: 13px; color: var(--text-2); }

    .summary-right {
      font-size: 12px;
      color: var(--text-3);
      text-align: right;
      line-height: 1.55;
    }

    .summary-right strong { color: var(--text-2); font-weight: 600; }

    .summary-div {
      height: 1px;
      background: var(--sep);
      margin: 11px 0 9px;
    }

    .summary-meta { font-size: 11px; color: var(--text-3); }

    /* ── Pollen Grid ── */
    .pollen-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ── Pollen Card ── */
    .pollen-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 14px 16px 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 2px 10px rgba(0,0,0,0.04);
      animation: fadeUp 0.28s ease both;
    }

    @media (prefers-color-scheme: dark) {
      .pollen-card { box-shadow: none; }
    }

    @media (hover: hover) {
      .pollen-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
      .pollen-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.09);
      }
    }

    .pollen-card:nth-child(1)  { animation-delay:   0ms; }
    .pollen-card:nth-child(2)  { animation-delay:  25ms; }
    .pollen-card:nth-child(3)  { animation-delay:  50ms; }
    .pollen-card:nth-child(4)  { animation-delay:  75ms; }
    .pollen-card:nth-child(5)  { animation-delay: 100ms; }
    .pollen-card:nth-child(6)  { animation-delay: 125ms; }
    .pollen-card:nth-child(7)  { animation-delay: 150ms; }
    .pollen-card:nth-child(8)  { animation-delay: 175ms; }
    .pollen-card:nth-child(9)  { animation-delay: 200ms; }
    .pollen-card:nth-child(10) { animation-delay: 225ms; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .card-en   { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .card-season { font-size: 10px; color: var(--text-3); margin-top: 1px; }
    .card-icon { font-size: 20px; line-height: 1; }

    .card-value-row {
      display: flex;
      align-items: baseline;
      gap: 3px;
      margin-bottom: 9px;
    }

    .card-value {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    .card-unit { font-size: 12px; color: var(--text-3); }
    .card-conc { font-size: 10px; color: var(--text-3); margin-left: auto; white-space: nowrap; }

    .level-row { display: flex; align-items: center; gap: 7px; }

    .level-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .level-track {
      flex: 1;
      height: 3px;
      background: var(--sep);
      border-radius: 1.5px;
      overflow: hidden;
    }

    .level-fill {
      height: 100%;
      border-radius: 1.5px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Level States ── */
    .l-none .card-value  { color: var(--text-3); }
    .l-none .level-label { color: var(--text-3); }
    .l-none .level-fill  { background: var(--c-none); }
    .dot-none            { background: rgba(120,120,128,0.4); }

    .l-low .card-value   { color: var(--c-low-t); }
    .l-low .level-label  { color: var(--c-low-t); }
    .l-low .level-fill   { background: var(--c-low); }
    .dot-low             { background: var(--c-low); }

    .l-medium .card-value  { color: var(--c-med-t); }
    .l-medium .level-label { color: var(--c-med-t); }
    .l-medium .level-fill  { background: var(--c-med); }
    .dot-medium            { background: var(--c-med); }

    .l-high .card-value  { color: var(--c-high-t); }
    .l-high .level-label { color: var(--c-high-t); }
    .l-high .level-fill  { background: var(--c-high); }
    .dot-high            { background: var(--c-high); }

    .l-very-high .card-value  { color: var(--c-vhi-t); }
    .l-very-high .level-label { color: var(--c-vhi-t); }
    .l-very-high .level-fill  { background: var(--c-vhi); }
    .dot-very-high            { background: var(--c-vhi); }

    .l-nodata { opacity: 0.35; }

    .card-nodata { font-size: 12px; color: var(--text-3); padding-top: 8px; }

    /* ── State Views ── */
    .state-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 12px;
    }

    .state-view p { font-size: 14px; color: var(--text-2); text-align: center; }

    .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid var(--sep);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ── Footer ── */
    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.9;
    }

    .footer a { color: var(--text-3); text-decoration: underline; text-decoration-color: var(--sep); }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .pollen-grid { grid-template-columns: 1fr; }
      .app-title { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <div>
        <h1 class="app-title">Pollenflug</h1>
        <button class="location-btn" id="geoBtn" aria-label="Standort aktualisieren">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="locationName">Standort ermitteln …</span>
        </button>
      </div>
      <div class="app-icon" aria-hidden="true">🌿</div>
    </header>

    <nav class="segmented" id="dayTabs" aria-label="Tagauswahl">
      <button class="seg active" data-day="0">
        Heute
        <span class="seg-sub" id="tabDate0"></span>
      </button>
      <button class="seg" data-day="1">
        Morgen
        <span class="seg-sub" id="tabDate1"></span>
      </button>
      <button class="seg" data-day="2">
        Übermorgen
        <span class="seg-sub" id="tabDate2"></span>
      </button>
    </nav>

    <div class="summary" id="summary" style="display:none;"></div>
    <div id="content"></div>

    <footer class="footer">
      <a href="https://www.dwd.de" target="_blank" rel="noopener">DWD</a> ·
      <a href="https://epin.lgl.bayern.de" target="_blank" rel="noopener">LGL Bayern ePIN</a> ·
      <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><br>
      Kein Ersatz für ärztlichen Rat
    </footer>

  </div>

  <script>
  // ─── Locations ───────────────────────────────────────────────────────────────
  const LOCATIONS = {
    pfarrkirchen: { name: 'Pfarrkirchen', lat: 48.4320, lon: 12.9386, country: 'DE', dwd: 122, lgl: 'DEALTO' },
    munich:       { name: 'München',      lat: 48.1351, lon: 11.5820, country: 'DE', dwd: 121, lgl: 'DEMUNC' },
    nuremberg:    { name: 'Nürnberg',     lat: 49.4521, lon: 11.0767, country: 'DE', dwd: 123, lgl: 'DEFEUC' },
    augsburg:     { name: 'Augsburg',     lat: 48.3705, lon: 10.8978, country: 'DE', dwd: 121, lgl: 'DEMIND' },
    ingolstadt:   { name: 'Ingolstadt',   lat: 48.7665, lon: 11.4258, country: 'DE', dwd: 121, lgl: 'DEMUNC' },
    regensburg:   { name: 'Regensburg',   lat: 49.0134, lon: 12.1016, country: 'DE', dwd: 123, lgl: 'DEVIEC' },
    stuttgart:    { name: 'Stuttgart',    lat: 48.7758, lon:  9.1829, country: 'DE', dwd: 112, lgl: null     },
    freiburg:     { name: 'Freiburg',     lat: 47.9990, lon:  7.8421, country: 'DE', dwd: 111, lgl: null     },
    ulm:          { name: 'Ulm',          lat: 48.4011, lon:  9.9876, country: 'DE', dwd: 112, lgl: 'DEMIND' },
    constance:    { name: 'Konstanz',     lat: 47.6631, lon:  9.1756, country: 'DE', dwd: 112, lgl: null     },
    vienna:       { name: 'Wien',         lat: 48.2082, lon: 16.3738, country: 'AT', dwd: null, lgl: null    },
    salzburg:     { name: 'Salzburg',     lat: 47.8095, lon: 13.0550, country: 'AT', dwd: null, lgl: null    },
    innsbruck:    { name: 'Innsbruck',    lat: 47.2692, lon: 11.4041, country: 'AT', dwd: null, lgl: null    },
    graz:         { name: 'Graz',         lat: 47.0707, lon: 15.4395, country: 'AT', dwd: null, lgl: null    },
    linz:         { name: 'Linz',         lat: 48.3069, lon: 14.2858, country: 'AT', dwd: null, lgl: null    },
    klagenfurt:   { name: 'Klagenfurt',   lat: 46.6228, lon: 14.3051, country: 'AT', dwd: null, lgl: null    },
    bregenz:      { name: 'Bregenz',      lat: 47.5031, lon:  9.7471, country: 'AT', dwd: null, lgl: null    },
  };

  // ─── Pollen types ────────────────────────────────────────────────────────────
  const POLLEN = [
    { key: 'hazel',   name: 'Hasel',    en: 'Hazel',   season: 'Jan – Mär', icon: '🌰', dwd: 'Hasel',    om: null              },
    { key: 'alder',   name: 'Erle',     en: 'Alder',   season: 'Jan – Apr', icon: '🌳', dwd: 'Erle',     om: 'alder_pollen'    },
    { key: 'ash',     name: 'Esche',    en: 'Ash',     season: 'Mär – Mai', icon: '🌿', dwd: 'Esche',    om: null              },
    { key: 'birch',   name: 'Birke',    en: 'Birch',   season: 'Apr – Mai', icon: '🌲', dwd: 'Birke',    om: 'birch_pollen'    },
    { key: 'plane',   name: 'Platane',  en: 'Plane',   season: 'Apr – Mai', icon: '🌴', dwd: null,       om: null              },
    { key: 'olive',   name: 'Olive',    en: 'Olive',   season: 'Mai – Jun', icon: '🫒', dwd: null,       om: 'olive_pollen'    },
    { key: 'grass',   name: 'Gräser',   en: 'Grass',   season: 'Mai – Sep', icon: '🌾', dwd: 'Graeser',  om: 'grass_pollen'    },
    { key: 'rye',     name: 'Roggen',   en: 'Rye',     season: 'Mai – Jun', icon: '🌻', dwd: 'Roggen',   om: null              },
    { key: 'mugwort', name: 'Beifuß',   en: 'Mugwort', season: 'Jul – Sep', icon: '🍃', dwd: 'Beifuss',  om: 'mugwort_pollen'  },
    { key: 'ragweed', name: 'Ambrosia', en: 'Ragweed', season: 'Aug – Okt', icon: '🌱', dwd: 'Ambrosia', om: 'ragweed_pollen'  },
  ];

  const LGL_MAP = {
    Alnus: 'alder', Betula: 'birch', Platanus: 'plane', Fraxinus: 'ash',
    Corylus: 'hazel', Poaceae: 'grass', Secale: 'rye',
    Artemisia: 'mugwort', Ambrosia: 'ragweed',
  };

  const LGL_THR = {
    Alnus:    [1,  20, 200, 1000],
    Betula:   [1,  20, 200, 1000],
    Platanus: [1,  20, 200, 1000],
    Fraxinus: [1,  20, 200, 1000],
    Corylus:  [1,  20, 200, 1000],
    Poaceae:  [1,  10, 100,  500],
    Secale:   [1,  10, 100,  500],
    Artemisia:[1,  20, 200, 1000],
    Ambrosia: [1,  10,  50,  200],
  };

  const OM_THR = {
    alder_pollen:   [15,  90,  500],
    birch_pollen:   [15,  90, 1500],
    grass_pollen:   [10,  50,  200],
    mugwort_pollen: [10,  50,  200],
    ragweed_pollen: [10,  50,  200],
    olive_pollen:   [10,  50,  200],
  };

  const DWD_MAP = {
    '0':   { level: 'none',   num: 0   },
    '0-1': { level: 'low',    num: 0.5 },
    '1':   { level: 'low',    num: 1   },
    '1-2': { level: 'medium', num: 1.5 },
    '2':   { level: 'medium', num: 2   },
    '2-3': { level: 'high',   num: 2.5 },
    '3':   { level: 'high',   num: 3   },
  };

  const LEVELS     = ['none', 'low', 'medium', 'high', 'very-high'];
  const LEVEL_DE   = { none: 'Kein Flug', low: 'Niedrig', medium: 'Mittel', high: 'Hoch', 'very-high': 'Sehr hoch' };
  const SUMMARY_DE = { none: 'Kaum Belastung', low: 'Geringe Belastung', medium: 'Mittlere Belastung', high: 'Hohe Belastung', 'very-high': 'Sehr hohe Belastung' };

  // ─── State ───────────────────────────────────────────────────────────────────
  const state = {
    locationKey: 'munich',
    selectedDay: 0,
    data: null,
    customCoords: null,
    fetchedAt: null,
  };

  let dwdCache = null;
  let lglCache = null;

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  function highestLevel(levels) {
    return levels.reduce((best, l) =>
      LEVELS.indexOf(l) > LEVELS.indexOf(best) ? l : best, 'none');
  }

  function fmtDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr + 'T12:00:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  }

  // ─── DWD API ─────────────────────────────────────────────────────────────────
  const DWD_URL = 'https://opendata.dwd.de/climate_environment/health/alerts/s31fg.json';
  function dwdFetchUrl() {
    return location.hostname.endsWith('.netlify.app') || location.hostname.endsWith('.netlify.com')
      ? '/dwd-api'
      : `https://cors.eu.org/${DWD_URL}`;
  }

  async function fetchDWD() {
    if (dwdCache) return dwdCache;
    const r = await fetch(dwdFetchUrl());
    if (!r.ok) throw new Error('DWD ' + r.status);
    dwdCache = await r.json();
    return dwdCache;
  }

  function parseDwdVal(str) {
    if (!str || str === '-1') return null;
    const e = DWD_MAP[str];
    if (!e) return null;
    const display = Number.isInteger(e.num) ? String(e.num) : e.num.toFixed(1);
    return { level: e.level, display, unit: '/ 3', source: 'dwd', pct: Math.round(e.num / 3 * 100) };
  }

  function extractDWDDays(raw, partregionId) {
    const region = raw.content.find(r => r.partregion_id === partregionId);
    if (!region) return null;
    const base = new Date(raw.last_update.split(' ')[0] + 'T12:00:00');
    const p = region.Pollen;
    return ['today', 'tomorrow', 'dayafter_to'].map((field, i) => {
      const d = new Date(base);
      d.setDate(d.getDate() + i);
      return {
        date: d.toISOString().split('T')[0],
        dwd: {
          hazel:   parseDwdVal(p.Hasel?.[field]),
          alder:   parseDwdVal(p.Erle?.[field]),
          ash:     parseDwdVal(p.Esche?.[field]),
          birch:   parseDwdVal(p.Birke?.[field]),
          grass:   parseDwdVal(p.Graeser?.[field]),
          rye:     parseDwdVal(p.Roggen?.[field]),
          mugwort: parseDwdVal(p.Beifuss?.[field]),
          ragweed: parseDwdVal(p.Ambrosia?.[field]),
        },
      };
    });
  }

  // ─── Open-Meteo API ───────────────────────────────────────────────────────────
  async function fetchOM(lat, lon) {
    const vars = POLLEN.filter(p => p.om).map(p => p.om).join(',');
    const url = `https://air-quality-api.open-meteo.com/v1/air-quality`
      + `?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=auto&forecast_days=3`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Open-Meteo ' + r.status);
    return r.json();
  }

  function processOM(raw) {
    const times = raw.hourly.time;
    const byDay = {};
    for (let i = 0; i < times.length; i++) {
      const date = times[i].split('T')[0];
      if (!byDay[date]) byDay[date] = { date };
      for (const p of POLLEN) {
        if (!p.om) continue;
        const v = raw.hourly[p.om]?.[i] ?? 0;
        byDay[date][p.key] = Math.max(byDay[date][p.key] ?? 0, v || 0);
      }
    }
    return Object.values(byDay)
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(day => {
        const om = {};
        for (const p of POLLEN) {
          if (!p.om) continue;
          const v = day[p.key] || 0;
          const thr = OM_THR[p.om] || [10, 50, 200];
          const level = v < 0.5 ? 'none'
            : v < thr[0] ? 'low'
            : v < thr[1] ? 'medium'
            : v < thr[2] ? 'high' : 'very-high';
          const display = v < 1 ? '0' : Math.round(v).toLocaleString('de-DE');
          let pct;
          if (v < 0.5)        pct = 0;
          else if (v < thr[0]) pct = Math.round((v / thr[0]) * 33);
          else if (v < thr[1]) pct = Math.round(33 + (v - thr[0]) / (thr[1] - thr[0]) * 33);
          else                 pct = Math.min(Math.round(66 + (v - thr[1]) / (thr[2] - thr[1]) * 34), 100);
          om[p.key] = { level, display, unit: 'K/m³', source: 'om', pct };
        }
        return { date: day.date, om };
      });
  }

  // ─── LGL Bayern ePIN API ─────────────────────────────────────────────────────
  const LGL_URL = 'https://epin.lgl.bayern.de/api/measurements';
  function lglFetchUrl() {
    return location.hostname.endsWith('.netlify.app') || location.hostname.endsWith('.netlify.com')
      ? '/lgl-api'
      : `https://cors.eu.org/${LGL_URL}`;
  }

  async function fetchLGL() {
    if (lglCache) return lglCache;
    const r = await fetch(lglFetchUrl());
    if (!r.ok) throw new Error('LGL ' + r.status);
    lglCache = await r.json();
    return lglCache;
  }

  function processLGL(raw, stationId) {
    const result = {};
    for (const m of raw.measurements) {
      if (m.location !== stationId) continue;
      const appKey = LGL_MAP[m.polle];
      if (!appKey) continue;
      const maxVal = Math.max(...m.data.map(d => d.value || 0));
      const thr = LGL_THR[m.polle] || [1, 20, 200, 1000];
      const level = maxVal < thr[0] ? 'none'
        : maxVal < thr[1] ? 'low'
        : maxVal < thr[2] ? 'medium'
        : maxVal < thr[3] ? 'high' : 'very-high';
      const display = maxVal < 1 ? '0' : Math.round(maxVal).toLocaleString('de-DE');
      let pct;
      if (maxVal < thr[0])      pct = Math.round((maxVal / thr[0]) * 33);
      else if (maxVal < thr[1]) pct = Math.round(33 + (maxVal - thr[0]) / (thr[1] - thr[0]) * 33);
      else if (maxVal < thr[2]) pct = Math.round(66 + (maxVal - thr[1]) / (thr[2] - thr[1]) * 17);
      else                      pct = Math.min(Math.round(83 + (maxVal - thr[2]) / (thr[3] - thr[2]) * 17), 100);
      result[appKey] = { level, display, unit: 'K/m³', source: 'lgl', pct };
    }
    return Object.keys(result).length > 0 ? result : null;
  }

  // ─── Merge ───────────────────────────────────────────────────────────────────
  function buildDays(dwdDays, omDays, lglToday = null) {
    const len = Math.max(dwdDays?.length ?? 0, omDays?.length ?? 0, 3);
    return Array.from({ length: len }, (_, i) => {
      const dwd  = dwdDays?.[i]?.dwd;
      const om   = omDays?.[i]?.om;
      const lgl  = i === 0 ? lglToday : null;
      const date = dwdDays?.[i]?.date ?? omDays?.[i]?.date;
      const pollens = {};
      for (const p of POLLEN) {
        if (lgl?.[p.key] != null) {
          pollens[p.key] = lgl[p.key];
        } else if (dwd?.[p.key] != null) {
          const entry = { ...dwd[p.key] };
          if (om?.[p.key]) entry.omDisplay = om[p.key].display;
          pollens[p.key] = entry;
        } else if (om?.[p.key] != null) {
          pollens[p.key] = om[p.key];
        } else {
          pollens[p.key] = null;
        }
      }
      return { date, pollens };
    });
  }

  // ─── Load ────────────────────────────────────────────────────────────────────
  async function loadData() {
    showLoading();
    const snapped = LOCATIONS[state.locationKey];
    const loc = state.customCoords
      ? {
          lat: state.customCoords.lat,
          lon: state.customCoords.lon,
          country: snapped?.country ?? 'DE',
          dwd: snapped?.dwd ?? null,
          lgl: snapped?.lgl ?? null,
        }
      : snapped;

    try {
      let dwdDays = null, omDays = null, lglToday = null;
      const lglStation = loc.lgl ?? null;

      if (loc.country === 'DE' && loc.dwd != null) {
        const [dwdResult, omResult, lglResult] = await Promise.allSettled([
          fetchDWD().then(raw => extractDWDDays(raw, loc.dwd)),
          fetchOM(loc.lat, loc.lon).then(processOM),
          lglStation ? fetchLGL().then(raw => processLGL(raw, lglStation)) : Promise.resolve(null),
        ]);
        dwdDays  = dwdResult.status  === 'fulfilled' ? dwdResult.value  : null;
        omDays   = omResult.status   === 'fulfilled' ? omResult.value   : null;
        lglToday = lglResult.status  === 'fulfilled' ? lglResult.value  : null;
        if (dwdDays === null && omDays === null && lglToday === null)
          throw new Error('Alle Datenquellen nicht verfügbar');
      } else {
        const omRaw = await fetchOM(loc.lat, loc.lon);
        omDays = processOM(omRaw);
      }

      state.data = buildDays(dwdDays, omDays, lglToday);
      state.fetchedAt = new Date();
      render();
    } catch (err) {
      showError(err.message);
    }
  }

  // ─── Geolocation ─────────────────────────────────────────────────────────────
  function requestGeo() {
    const btn    = document.getElementById('geoBtn');
    const nameEl = document.getElementById('locationName');

    if (!navigator.geolocation) {
      nameEl.textContent = LOCATIONS[state.locationKey].name;
      loadData();
      return;
    }

    btn.classList.add('loading');
    nameEl.textContent = 'Standort wird ermittelt …';
    showLoading();

    navigator.geolocation.getCurrentPosition(
      ({ coords }) => {
        btn.classList.remove('loading');
        let nearest = 'munich', nearestDist = Infinity;
        for (const [key, loc] of Object.entries(LOCATIONS)) {
          const d = Math.hypot(loc.lat - coords.latitude, loc.lon - coords.longitude);
          if (d < nearestDist) { nearestDist = d; nearest = key; }
        }
        state.locationKey  = nearest;
        state.customCoords = { lat: coords.latitude, lon: coords.longitude };
        nameEl.textContent = LOCATIONS[nearest].name;
        loadData();
      },
      () => {
        btn.classList.remove('loading');
        nameEl.textContent = LOCATIONS[state.locationKey].name;
        state.customCoords = null;
        loadData();
      },
      { timeout: 8000, maximumAge: 300000 }
    );
  }

  // ─── Render ──────────────────────────────────────────────────────────────────
  function showLoading() {
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <div class="spinner"></div>
        <p>Pollendaten werden geladen …</p>
      </div>`;
  }

  function showError(msg) {
    document.getElementById('summary').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="state-view">
        <p style="font-size:28px;">⚠️</p>
        <p>Daten konnten nicht geladen werden.</p>
        <p style="font-size:12px;color:var(--text-3);">${msg}</p>
      </div>`;
  }

  function render() {
    if (!state.data?.length) return showError('Keine Daten verfügbar');
    const dayData = state.data[state.selectedDay];
    if (!dayData) return showError('Prognosedaten nicht verfügbar');

    state.data.forEach((day, i) => {
      const el = document.getElementById(`tabDate${i}`);
      if (el && day?.date) el.textContent = fmtDate(day.date);
    });

    const levelsWithData = POLLEN
      .filter(p => dayData.pollens[p.key] !== null)
      .map(p => dayData.pollens[p.key]?.level ?? 'none');
    const overall = highestLevel(levelsWithData);

    let dominant = null, domIdx = -1;
    for (const p of POLLEN) {
      const entry = dayData.pollens[p.key];
      if (!entry) continue;
      const idx = LEVELS.indexOf(entry.level);
      if (idx > domIdx) { domIdx = idx; dominant = p; }
    }

    const SOURCE_LABELS = { lgl: 'LGL Bayern ePIN', dwd: 'DWD', om: 'Open-Meteo' };
    const usedSources = new Set();
    for (const p of POLLEN) {
      const src = dayData.pollens[p.key]?.source;
      if (src) usedSources.add(src);
    }
    const sourceText  = [...usedSources].map(s => SOURCE_LABELS[s] || s).join(' · ');
    const fetchedText = state.fetchedAt
      ? state.fetchedAt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'
      : '';

    const summaryEl = document.getElementById('summary');
    summaryEl.style.display = 'block';
    summaryEl.innerHTML = `
      <div class="summary-row">
        <div class="summary-left">
          <div class="summary-dot dot-${overall}"></div>
          <div class="summary-text">
            <strong>${SUMMARY_DE[overall]}</strong>
            <span class="s-date">${fmtDate(dayData.date)}</span>
          </div>
        </div>
        <div class="summary-right">
          ${dominant && domIdx > 0
            ? `Hauptbelastung<br><strong>${dominant.name}</strong>`
            : 'Keine aktiven Pollen'}
        </div>
      </div>
      <div class="summary-div"></div>
      <div class="summary-meta">
        Quelle: ${sourceText}${fetchedText ? ` &middot; Abgerufen: ${fetchedText}` : ''}
      </div>`;

    const grid = document.createElement('div');
    grid.className = 'pollen-grid';

    const sortedPollen = [...POLLEN].sort((a, b) => {
      const aE = dayData.pollens[a.key];
      const bE = dayData.pollens[b.key];
      if (!aE && !bE) return 0;
      if (!aE) return 1;
      if (!bE) return -1;
      return LEVELS.indexOf(bE.level) - LEVELS.indexOf(aE.level);
    });

    for (const p of sortedPollen) {
      const entry = dayData.pollens[p.key];
      const card  = document.createElement('div');
      if (!entry) {
        card.className = 'pollen-card l-nodata';
        card.innerHTML = `
          <div class="card-top">
            <div>
              <div class="card-name">${p.name}</div>
              <div class="card-en">${p.en}</div>
              <div class="card-season">${p.season}</div>
            </div>
            <span class="card-icon">${p.icon}</span>
          </div>
          <div class="card-nodata">Keine Daten</div>`;
      } else {
        card.className = `pollen-card l-${entry.level}`;
        card.innerHTML = `
          <div class="card-top">
            <div>
              <div class="card-name">${p.name}</div>
              <div class="card-en">${p.en}</div>
              <div class="card-season">${p.season}</div>
            </div>
            <span class="card-icon">${p.icon}</span>
          </div>
          <div class="card-value-row">
            <span class="card-value">${entry.display}</span>
            <span class="card-unit">${entry.unit}</span>
            ${entry.omDisplay && entry.omDisplay !== '0' ? `<span class="card-conc">~${entry.omDisplay} K/m³</span>` : ''}
          </div>
          <div class="level-row">
            <span class="level-label">${LEVEL_DE[entry.level]}</span>
            <div class="level-track"><div class="level-fill" style="width:${entry.pct ?? 0}%"></div></div>
          </div>`;
      }
      grid.appendChild(card);
    }

    document.getElementById('content').replaceChildren(grid);
  }

  // ─── Tabs & date labels ───────────────────────────────────────────────────────
  function setupDateLabels() {
    const today = new Date();
    for (let i = 0; i < 3; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const el = document.getElementById(`tabDate${i}`);
      if (el) el.textContent = d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
    }
  }

  function syncTabs() {
    document.querySelectorAll('.seg').forEach(t => {
      t.classList.toggle('active', parseInt(t.dataset.day) === state.selectedDay);
    });
  }

  // ─── Events ──────────────────────────────────────────────────────────────────
  document.getElementById('dayTabs').addEventListener('click', e => {
    const tab = e.target.closest('.seg');
    if (!tab) return;
    state.selectedDay = parseInt(tab.dataset.day, 10);
    syncTabs();
    render();
  });

  document.getElementById('geoBtn').addEventListener('click', () => {
    dwdCache = null;
    lglCache = null;
    state.data = null;
    state.fetchedAt = null;
    requestGeo();
  });

  // ─── Init ────────────────────────────────────────────────────────────────────
  setupDateLabels();
  requestGeo();
  </script>
</body>
</html>
