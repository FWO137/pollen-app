# Static site, no bundler — but the Netlify Functions below (push
# notifications) have real runtime dependencies (web-push, @netlify/blobs)
# that need installing so esbuild can bundle them. --omit=dev skips
# @playwright/test (and its browser download) entirely rather than just
# leaving it unused, since Netlify's build has no use for it.
[build]
  publish = "."
  command = "npm ci --omit=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # Explicitly allow geolocation from this origin.
    # Without this, Netlify's CDN may inject Permissions-Policy: geolocation=()
    # which blocks the browser Geolocation API regardless of iOS system settings.
    Permissions-Policy = "geolocation=(self)"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Single-file inline app: script/style must stay 'unsafe-inline' (no
    # external bundle to hash/nonce). connect-src is scoped to the actual
    # APIs the app talks to (DWD/LGL via same-origin redirects, Open-Meteo
    # directly) instead of allowing arbitrary hosts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://air-quality-api.open-meteo.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# index.html, pollen-logic.js and sw.js are versioned together as one
# unit but shipped as separate static files with no build-time hashing.
# Force revalidation on every load (cheap 304s via ETag) so a deploy can
# never leave a stale pollen-logic.js paired with a newer index.html.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/pollen-logic.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
